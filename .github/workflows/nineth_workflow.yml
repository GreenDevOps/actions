name: Nineth Workflow
on:
    repository_dispatch:
        types: [test]

jobs:
    run-first-command:
        runs-on: ubuntu-latest
        steps:
            - name: Event Vars
              run: |
                  echo "Event Name: ${{ github.event_name }} "
                  echo "Event Action: ${{ github.event.action }}"
                  echo "Event Client Payload: ${{ toJson(github.event.client_payload) }}"
