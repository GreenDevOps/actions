name: Fifteenth Workflow
on: [push]
jobs:
    run-first-command:
        runs-on: ubuntu-latest
        steps:
            - name: UUIDGenerator
              run: |
                  uuidgen > uuid.txt
            - name: Upload UUID file as artifact
              uses: actions/upload-artifact@v7
              with:
                  name: uuid-artifact
                  path: uuid.txt
    second-command:
        runs-on: ubuntu-latest
        needs: run-first-command
        steps:
            - name: Download UUID file artifact
              uses: actions/download-artifact@v7
              with:
                  name: uuid-artifact
            - name: Show UUID file contents
              run: |
                  v=$(cat uuid.txt)
                  echo "UUID file contents: $v"
