name: Seventeenth Workflow
on:
    workflow_dispatch:
        inputs:
            title:
                description: "The title to use in the workflow"
                required: false
                type: string
                default: "Default Title"
jobs:
    - name: Call Reusable Workflow
      uses: ./.github/workflows/workflow.yml
      with:
          title: ${{ inputs.title }}
