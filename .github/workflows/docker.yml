name: Docker Test
on: [push]
jobs:
    test-docker-container:
        runs-on: ubuntu-latest
        services:
            customMysql:
                image: mysql:5.7
                env:
                    MYSQL_ROOT_PASSWORD: password
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd "mysqladmin ping"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 3
        container:
            image: node:13
            env:
                NODE_ENV: test
            ports:
                - 80
        steps:
            - name: Display Service Image Info
              run: |
                  echo '${{ toJson(job.services) }}'
            - name: Display Node.js version
              run: |
                  node -v
                  cat /etc/os-release
            - name: Another node image test
              uses: docker://node:22-trixie-slim
              with:
                  entrypoint: /bin/bash
                  args: -c "node -v && cat /etc/os-release"
