name: Second Workflow
on:
    - push

jobs:
    run-first-command:
        runs-on: ubuntu-latest
        steps:
            - name: Show Python version on Ubuntu
              run: python -V
    run-parallel-command:
        runs-on: windows-latest
        steps:
            - name: Show Python version on Windows
              run: python -V
    run-third-command:
        runs-on: macos-latest
        needs: run-first-command
        steps:
            - name: Show Python version on macOS
              run: python -V
